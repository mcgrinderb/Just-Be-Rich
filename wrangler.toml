name = "just-be-rich"
main = "functions/api/index.js"
type = "javascript"
compatibility_date = "2024-01-01"

[env.production]
routes = [
  { pattern = "/api/*", zone_name = "example.com" }
]

[build]
command = ""
cwd = "./"
watch_paths = ["public/**/*.js", "public/**/*.html"]

[[kv_namespaces]]
binding = "WATCHLIST_KV"
id = ""
preview_id = ""

[env.production.vars]
# Add FINNHUB_KEY in Cloudflare dashboard

[triggers]
crons = []
